<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 503" role="img" aria-labelledby="title desc">
<title id="title">连接池耗尽可能是连锁反应</title><desc id="desc">工程示意 · 按证据分析，结合实际配置验证。SQL 执行时间增长：扫描、排序、锁等待或其他资源瓶颈；数据库连接占用时间变长：HikariCP 活跃连接达到上限；Tomcat 请求线程等待连接：尾延迟和错误率上升，共享资源的其他接口受影响</desc>
